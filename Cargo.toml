[package]
name = "gxwi-my-settings"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Beside this checkout until a libgxwi with the dialog role is released.
libgxwi = { path = "../gxwi/libgxwi" }
# The registry. Every crate in one program must pin the same revision:
# `peios-sys` links libpeios, and a program can hold only one.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "2a2a6bb022192f6e98d4e4a6a7efdbdd40d53b35", package = "peios" }
# Changing one's own password and keys (authd's logon socket), and reading
# one's own account and setting one's display name (lpsd's self socket).
# Beside this checkout until it is pushed.
libauthd-client = { path = "../authd/libauthd-client" }
libauthd = { path = "../authd/libauthd" }
# Which languages are installed, and what a session will honour.
libsession = { path = "../authd/libsession" }
jiff = "0.2.29"

[dev-dependencies]
# The events a window is sent carry a JSON value, which libgxwi re-exports.
serde_json = "1"
